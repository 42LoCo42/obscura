name: Build all outputs

on:
  workflow_dispatch:
  push:
    paths:
      - "hashes.json"
      - "packages/**"
  repository_dispatch:
    types:
      - trigger-build

jobs:
  nix-matrix:
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7

      - id: set-matrix
        name: Generate Nix Matrix
        run: ./ci-matrix.sh > "$GITHUB_OUTPUT"

  nix-build:
    needs: nix-matrix
    if: ${{ needs.nix-matrix.outputs.matrix != '' }}

    strategy:
      fail-fast: false
      matrix: ${{fromJSON(needs.nix-matrix.outputs.matrix)}}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: $/.github/actions/nix-setup

      - name: Set up Attic cache
        uses: ryanccn/attic-action@v0.4.1
        with:
          endpoint: https://attic.eleonora.gay
          cache: default
          token: ${{ secrets.ATTIC_TOKEN }}

      - run: nix build -L '.#packages.${{ matrix.arch }}.${{ matrix.name }}'
